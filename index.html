
<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Cadastro JDBC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --ciano: #22d3ee;
            --violeta: #8b5cf6;
            --verde: #34d399;
        }

        body {
            min-height: 100vh;
            color: #e2e8f0;
            background:
                radial-gradient(circle at 15% 10%, rgba(139, 92, 246, 0.18), transparent 45%),
                radial-gradient(circle at 85% 90%, rgba(34, 211, 238, 0.14), transparent 45%),
                #070b17;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(34, 211, 238, 0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34, 211, 238, 0.07) 1px, transparent 1px);
            background-size: 44px 44px;
            -webkit-mask-image: radial-gradient(ellipse at center, #000 25%, transparent 75%);
            mask-image: radial-gradient(ellipse at center, #000 25%, transparent 75%);
        }

        main { position: relative; z-index: 1; }

        .logo { color: var(--ciano); filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.6)); }

        .titulo {
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #fff, var(--ciano));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .painel {
            position: relative;
            overflow: hidden;
            background: rgba(15, 23, 42, 0.72);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(34, 211, 238, 0.25);
            border-radius: 1rem;
            box-shadow: 0 0 40px rgba(34, 211, 238, 0.08);
        }

        .painel.varrendo::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--ciano), transparent);
            animation: varredura 1.2s linear infinite;
        }

        @keyframes varredura {
            from { transform: translateX(-100%); }
            to { transform: translateX(100%); }
        }

        .rotulo {
            font-size: 0.72rem;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #94a3b8;
        }

        .form-control {
            background: rgba(2, 6, 23, 0.6);
            border-color: rgba(148, 163, 184, 0.25);
        }

        .form-control:focus {
            border-color: var(--ciano);
            box-shadow: 0 0 0 0.2rem rgba(34, 211, 238, 0.18);
        }

        .botao-principal {
            border: 0;
            color: #04111f;
            font-weight: 600;
            background: linear-gradient(90deg, var(--ciano), var(--violeta));
            box-shadow: 0 0 18px rgba(34, 211, 238, 0.35);
        }

        .botao-principal:hover { color: #04111f; filter: brightness(1.1); }
        .botao-principal:disabled { opacity: 0.6; box-shadow: none; }

        .entrada-resultado { animation: surgir 0.4s ease-out; }

        @keyframes surgir {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .banner { max-width: 400px; opacity: 0.9; }
    </style>
</head>
<body>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-7 col-xl-5">

            <header class="text-center mb-4">
                <svg class="logo mb-2" width="52" height="52" viewBox="0 0 52 52" fill="none"
                     stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <ellipse cx="26" cy="12" rx="16" ry="6"/>
                    <path d="M10 12v14c0 3.3 7.2 6 16 6s16-2.7 16-6V12"/>
                    <path d="M10 26v14c0 3.3 7.2 6 16 6s16-2.7 16-6V26"/>
                </svg>
                <h1 class="titulo display-5">Cadastro JDBC</h1>
                <p class="text-secondary mb-0">
                    Cadastre seu nome e email. Os dados são gravados em um banco de dados na nuvem.
                </p>
            </header>

            <section id="painel-formulario" class="painel">
                <form id="formulario" class="p-4">
                    <div class="mb-3">
                        <label for="nome" class="rotulo mb-2">Nome</label>
                        <input type="text" id="nome" class="form-control" placeholder="Seu nome completo"
                               autocomplete="name" required>
                    </div>
                    <div class="mb-4">
                        <label for="email" class="rotulo mb-2">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="voce@exemplo.com"
                               autocomplete="email" required>
                    </div>
                    <button id="enviar" type="submit" class="btn botao-principal w-100 py-2">
                        <span id="spinner" class="spinner-border spinner-border-sm me-2 d-none" aria-hidden="true"></span>
                        <span id="rotuloBotao">Cadastrar</span>
                    </button>
                </form>
            </section>

            <section id="area-resultado" class="mt-4"></section>

            <div class="text-center mt-4">
                <img src="banner-cadastro-jdbc.png" alt="Cadastro JDBC" class="banner img-fluid rounded">
            </div>

        </div>
    </div>
</main>

<script>
    const URL_API = 'https://cadastro-jdbc.onrender.com/pessoas';
    const TEMPO_SERVIDOR_DORMINDO_MS = 4000;

    const formulario = document.getElementById('formulario');
    const campoNome = document.getElementById('nome');
    const campoEmail = document.getElementById('email');
    const botao = document.getElementById('enviar');
    const spinner = document.getElementById('spinner');
    const rotuloBotao = document.getElementById('rotuloBotao');
    const painelFormulario = document.getElementById('painel-formulario');
    const areaResultado = document.getElementById('area-resultado');

    let temporizadorEspera = null;

    function mostrarMensagem(classe, mensagem) {
        const alerta = document.createElement('div');
        alerta.className = 'alert ' + classe + ' border-0 mb-0 entrada-resultado';
        alerta.textContent = mensagem;
        areaResultado.replaceChildren(alerta);
    }

    function definirCarregando(carregando) {
        botao.disabled = carregando;
        spinner.classList.toggle('d-none', !carregando);
        painelFormulario.classList.toggle('varrendo', carregando);
        rotuloBotao.textContent = carregando ? 'Enviando...' : 'Cadastrar';

        clearTimeout(temporizadorEspera);
        if (carregando) {
            temporizadorEspera = setTimeout(() => {
                rotuloBotao.textContent = 'Acordando o servidor...';
            }, TEMPO_SERVIDOR_DORMINDO_MS);
        }
    }

    async function cadastrar() {
        const corpo = new URLSearchParams({
            nome: campoNome.value.trim(),
            email: campoEmail.value.trim()
        });

        definirCarregando(true);
        try {
            const resposta = await fetch(URL_API, { method: 'POST', body: corpo });
            const mensagem = await resposta.text();

            if (!resposta.ok) {
                mostrarMensagem('alert-danger', mensagem);
                return;
            }
            mostrarMensagem('alert-success', mensagem);
            formulario.reset();
            campoNome.focus();
        } catch (erro) {
            mostrarMensagem('alert-danger', 'Não foi possível conectar ao servidor. Tente novamente em instantes.');
        } finally {
            definirCarregando(false);
        }
    }

    formulario.addEventListener('submit', (evento) => {
        evento.preventDefault();
        cadastrar();
    });
</script>
</body>
</html>
